name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch: # also started by the price collector after each price update
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
          EXPO_PUBLIC_VEHICLE_LOOKUP_URL: ${{ vars.VEHICLE_LOOKUP_URL }}
          EXPO_PUBLIC_CONTACT: ${{ vars.CONTACT }}
      # Fuel Finder only answers UK traffic, so prices are collected on a UK machine
      # (collector/) and pushed to the 'prices' branch. Publish the latest copy with the site.
      - name: Add latest fuel prices
        run: |
          if git fetch --depth 1 origin prices 2>/dev/null; then
            git show origin/prices:prices.json > dist/prices.json && echo "Added prices.json ($(wc -c < dist/prices.json) bytes)"
          else
            echo "No prices branch yet"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
