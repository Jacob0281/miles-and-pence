name: Deploy vehicle lookup
# Deploys worker/ to Cloudflare and copies the vehicle-data credentials from GitHub secrets
# into the Worker. Run it from the Actions tab once the Cloudflare and DVSA/DVLA secrets exist.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set yet; skipping deploy."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Deploy Worker
        if: env.SKIP != '1'
        working-directory: worker
        run: npx --yes wrangler@4 deploy
      - name: Copy credentials into the Worker
        if: env.SKIP != '1'
        working-directory: worker
        env:
          MOT_CLIENT_ID: ${{ secrets.MOT_CLIENT_ID }}
          MOT_CLIENT_SECRET: ${{ secrets.MOT_CLIENT_SECRET }}
          MOT_API_KEY: ${{ secrets.MOT_API_KEY }}
          DVLA_API_KEY: ${{ secrets.DVLA_API_KEY }}
        run: |
          for name in MOT_CLIENT_ID MOT_CLIENT_SECRET MOT_API_KEY DVLA_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" >/dev/null && echo "Set $name"
            else
              echo "$name not provided (skipped)"
            fi
          done
