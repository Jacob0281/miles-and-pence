name: Deploy vehicle lookup
# Deploys worker/ to Cloudflare and copies the vehicle-data credentials from GitHub secrets
# into the Worker. Run it from the Actions tab once the Cloudflare and DVSA/DVLA secrets exist.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set yet; skipping deploy."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # Accept a pasted dashboard address as well as the bare 32-character account ID.
          ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-f]{32}' | head -1)
          if [ -z "$ID" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID doesn't contain a 32-character account ID"; exit 1; fi
          echo "::add-mask::$ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
      - name: Find or create the testers' data store
        if: env.SKIP != '1'
        working-directory: worker
        run: |
          NAME="miles-and-pence-testers"
          ID=$(npx --yes wrangler@4 kv namespace list 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s.slice(s.indexOf('[')));const n=a.find(x=>x.title==='$NAME');process.stdout.write(n?n.id:'')}catch(e){}})")
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 kv namespace create "$NAME" > create.log 2>&1 || true
            cat create.log
            ID=$(grep -oE 'id = "[0-9a-f]{32}"' create.log | grep -oE '[0-9a-f]{32}' | head -1)
            [ -z "$ID" ] && ID=$(grep -oE '"id": *"[0-9a-f]{32}"' create.log | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "$ID" ]; then echo "::error::Could not find or create the KV store"; exit 1; fi
          sed -i "s/__TESTERS_KV_ID__/$ID/" wrangler.toml
          echo "Using KV store $ID"
      - name: Deploy Worker
        if: env.SKIP != '1'
        working-directory: worker
        run: npx --yes wrangler@4 deploy
      - name: Copy credentials into the Worker
        if: env.SKIP != '1'
        working-directory: worker
        env:
          MOT_CLIENT_ID: ${{ secrets.MOT_CLIENT_ID }}
          MOT_CLIENT_SECRET: ${{ secrets.MOT_CLIENT_SECRET }}
          MOT_API_KEY: ${{ secrets.MOT_API_KEY }}
          DVLA_API_KEY: ${{ secrets.DVLA_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          for name in MOT_CLIENT_ID MOT_CLIENT_SECRET MOT_API_KEY DVLA_API_KEY ADMIN_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" >/dev/null && echo "Set $name"
            else
              echo "$name not provided (skipped)"
            fi
          done
